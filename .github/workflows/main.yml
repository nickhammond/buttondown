name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          # Series, not patch pins: only the latest patch of each series is
          # built for the runner images, so a pinned patch rots.
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # undercover compares against the base ref, so it needs history
        fetch-depth: 0

    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run CI
      run: bin/ci
